[package]
name = "video_core"
version = "0.1.0"
edition = "2021"
description = "Rust core for Android video editor - timeline, filters, transforms via MediaCodec"
license = "MIT"
crate-type = ["cdylib", "rlib"]

[lib]
name = "video_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rusttype = "0.9"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
