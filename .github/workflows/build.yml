name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK packages & NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "PATH=$PATH"
          ls -la "$ANDROID_HOME/cmdline-tools/" || true
          which sdkmanager || ls -lh "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Accept licenses non-interactively (required before install)
          yes | sdkmanager --licenses || true
          # Install required packages (platform-tools etc already preinstalled on ubuntu-latest, but ensure NDK + platforms)
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK installed:"
          ls -lh "$ANDROID_HOME/ndk/26.1.10909125" || true
          ndk-build --version || "$ANDROID_HOME/ndk/26.1.10909125/ndk-build" --version || true

      - name: Set up Rust stable + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Cache Rust cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-provider: buildjet

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || cargo install cargo-ndk

      - name: Rust checks (host tests)
        run: cargo test --manifest-path Cargo.toml

      - name: Build Rust core (arm64-v8a release)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -o android-app/app/src/main/jniLibs build --release --manifest-path Cargo.toml
          ls -lh android-app/app/src/main/jniLibs/arm64-v8a/libvideo_core.so
          file android-app/app/src/main/jniLibs/arm64-v8a/libvideo_core.so || true

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build Debug APK (sideload)
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Build Release APK (unsigned sideload)
        working-directory: android-app
        run: ./gradlew assembleRelease --stacktrace

      - name: List APKs
        run: |
          ls -lh android-app/app/build/outputs/apk/debug/ || true
          ls -lh android-app/app/build/outputs/apk/release/ || true
          find android-app -name "*.apk" -ls

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-apk
          path: android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
